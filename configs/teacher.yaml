# Distillation teacher at Wide ResNet-28-10 scale (36.7M params), trained from scratch on
# the same 45k/5k split as the students so their validation accuracy stays honest.
# Over the 5M limit on purpose: it is NEVER submitted (cifar-predict refuses it).
# No label smoothing: smoothed teachers transfer less knowledge (Muller et al., 2019).
run_name: teacher
model:
  channels: [160, 320, 640]
  blocks: [4, 4, 4]
  max_params: 50000000
optim:
  label_smoothing: 0.0
  sam_rho: 0.05
train:
  epochs: 200
