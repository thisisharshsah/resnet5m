# Main submission candidate: wide3 widened to use the budget (4.90M params), trained with
# SAM, CutMix and knowledge distillation from configs/teacher.yaml over a longer schedule.
#   1. cifar-train --config configs/teacher.yaml
#   2. cifar-train --config configs/student.yaml
run_name: student
model:
  channels: [96, 192, 320]
  blocks: [2, 2, 2]
augment:
  mix: cutmix
  mix_prob: 0.5
optim:
  label_smoothing: 0.0
  sam_rho: 0.05
train:
  epochs: 300
distill:
  teacher: runs/teacher/best.pt
  alpha: 0.9
  temperature: 4.0
