run_name: abl_sam
output_dir: runs
data:
  root: data
  cache_dir: .cache/data
  val_size: 5000
  num_workers: 11
augment:
  policy: autoaugment
  crop_padding: 4
  hflip: true
  erasing_prob: 0.25
  mix: none
  mix_alpha: 1.0
  mix_prob: 0.5
model:
  channels:
  - 80
  - 160
  - 320
  blocks:
  - 2
  - 2
  - 2
  kernel_size: 3
  skip_kernel_size: 1
  stem_channels: null
  pool_size: null
  dropout: 0.0
  se_ratio: 0.0
  zero_init_residual: true
  num_classes: 10
  max_params: 5000000
optim:
  name: sgd
  lr: 0.1
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
  label_smoothing: 0.1
  scheduler: cosine
  warmup_epochs: 5.0
  min_lr_ratio: 0.0
  sam_rho: 0.05
  sam_adaptive: false
train:
  epochs: 60
  batch_size: 128
  amp: true
  channels_last: true
  ema_decay: 0.999
  seed: 42
  eval_every: 1
  max_steps_per_epoch: null
  tta: true
  auto_resume: true
distill:
  teacher: null
  alpha: 0.9
  temperature: 4.0
